<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐥 Flappy Bird Game</title>
<style>
  body {
    background: linear-gradient(135deg, #74ABE2, #5563DE);
    margin: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    font-family: 'Poppins', sans-serif;
    height: 100vh;
  }
  canvas {
    background: #70c5ce;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    touch-action: none;
  }
  .menu {
    text-align: center;
  }
  .btn {
    background: #ffcc00;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    margin-top: 15px;
    font-weight: bold;
  }
</style>
</head>
<body>
  <h2>🐥 Flappy Bird</h2>
  <canvas id="gameCanvas" width="320" height="480"></canvas>
  <div class="menu">
    <div id="score">Score: 0 | High Score: 0</div>
    <button class="btn" onclick="startGame()">▶ Start Game</button>
    <button class="btn" onclick="location.href='index.html'">🏠 Back to Home</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let birdY, birdV, pipes, score, highScore, playing = false;
    const gravity = 0.4, jumpForce = -6, pipeSpeed = 2;

    // --- Sound system ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    function playSound(freq, type="sine", duration=0.15, volume=0.2) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }
    const jumpSound = () => playSound(600, "square", 0.1, 0.2);
    const hitSound = () => playSound(120, "sawtooth", 0.3, 0.3);
    const scoreSound = () => playSound(800, "triangle", 0.15, 0.2);

    // --- Resize canvas for mobile screens ---
    function resizeCanvas() {
      const scale = Math.min(window.innerWidth / 320, window.innerHeight / 480);
      canvas.style.transform = `scale(${scale})`;
      canvas.style.transformOrigin = 'top center';
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function resetGame() {
      birdY = 200;
      birdV = 0;
      pipes = [];
      score = 0;
    }

    function startGame() {
      playing = true;
      resetGame();
      loop();
    }

    function loop() {
      if (!playing) return;

      ctx.fillStyle = "#70c5ce";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bird physics
      birdV += gravity;
      birdY += birdV;
      if (birdY > canvas.height - 12) {
        birdY = canvas.height - 12;
        hitSound();
        playing = false;
      }

      // Spawn pipes occasionally
      if (Math.random() < 0.02) {
        let top = Math.random() * 180 + 40;
        pipes.push({ x: canvas.width, top });
      }

      // Bird draw
      ctx.fillStyle = "yellow";
      ctx.beginPath();
      ctx.arc(50, birdY, 12, 0, Math.PI * 2);
      ctx.fill();

      // Difficulty scaling
      let gap = Math.max(100, 140 - score * 2);

      // Pipes
      for (let i = 0; i < pipes.length; i++) {
        pipes[i].x -= pipeSpeed;
        let top = pipes[i].top;

        ctx.fillStyle = "green";
        // top pipe
        ctx.fillRect(pipes[i].x, 0, 40, top);
        // bottom pipe (properly sized)
        ctx.fillRect(pipes[i].x, top + gap, 40, canvas.height - (top + gap));

        // Scoring
        if (pipes[i].x + 40 === 50) {
          score++;
          scoreSound();
        }

        // Collision detection
        if (
          50 > pipes[i].x &&
          50 < pipes[i].x + 40 &&
          (birdY < top || birdY > top + gap)
        ) {
          hitSound();
          playing = false;
        }
      }

      // Remove off-screen pipes
      pipes = pipes.filter(p => p.x > -40);

      // Draw score text
      ctx.fillStyle = "white";
      ctx.font = "16px Poppins";
      ctx.fillText(`Score: ${score}`, 10, 20);

      document.getElementById("score").innerText =
        `Score: ${score} | High Score: ${Math.max(score, highScore || 0)}`;

      if (playing) requestAnimationFrame(loop);
      else {
        highScore = Math.max(score, highScore || 0);
        localStorage.setItem("flappyHighScore", highScore);
        showGameOver();
      }
    }

    function showGameOver() {
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "white";
      ctx.font = "24px Poppins";
      ctx.fillText("Game Over!", 90, 220);
      ctx.font = "16px Poppins";
      ctx.fillText("Tap to Restart", 100, 250);
    }

    function flap() {
      if (audioCtx.state === "suspended") audioCtx.resume(); // enable audio on first tap
      if (playing) {
        birdV = jumpForce;
        jumpSound();
      } else {
        startGame();
      }
    }

    // --- FIX: Avoid double jump ---
    const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (isTouch) {
      document.body.addEventListener("touchstart", flap, { passive: true });
    } else {
      document.body.addEventListener("mousedown", flap);
    }

    highScore = localStorage.getItem("flappyHighScore") || 0;
  </script>
</body>
</html>
