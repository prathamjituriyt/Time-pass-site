<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pratham's Game Hub</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 20px;
      animation: fadeIn 1.5s ease-in-out;
    }
    .container {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px;
      width: 150px;
      text-align: center;
      transition: 0.4s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .card:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.2);
    }
    img {
      width: 80px;
      height: 80px;
      margin-bottom: 10px;
      border-radius: 15px;
    }
    a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }
    footer {
      position: absolute;
      bottom: 15px;
      font-size: 14px;
      color: #ccc;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>🎮 Pratham's Game & Tool Hub</h1>

  <div class="container">
    <div class="card">
      <a href="calculator.html">
        <img src="https://cdn-icons-png.flaticon.com/512/992/992700.png" alt="Calculator">
        <div>Calculator</div>
      </a>
    </div>

    <div class="card">
      <a href="flappy.html">
        <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Flappy Bird">
        <div>Flappy Bird</div>
      </a>
    </div>
  </div>

  <footer>© 2025 Jituri Family | All Rights Reserved</footer>
</body>
</html>
